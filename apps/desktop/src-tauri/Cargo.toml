[package]
name = "autonomous-studio-desktop"
version = "1.0.0"
description = "Autonomous Studio Pro Desktop Core (Windows PC DirectX 12 / wgpu / NVENC)"
authors = ["Autonomous Studio Team"]
edition = "2021"

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
wgpu = "23.0"
image = "0.25"
anyhow = "1.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

